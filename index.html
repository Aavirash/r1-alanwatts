var RH = 38, VH = 254, VI = Math.floor(VH / RH);
var DCS = ['#FE5000','#FF6B2B','#FF9E4A','#E8456B','#2DD4BF','#60A5FA','#A78BFA','#F472B6','#34D399','#FBBF24','#FB923C','#818CF8'];
var MD = 'al', aI = 0, aS = 0, tI = 0, tS = 0, pA = -1, pT = -1, sT = null, dS = [];

var $ = {lst:document.getElementById('lst'),sd:document.getElementById('sd-lbl'),pf:document.getElementById('prog-fill'),
  pg:document.getElementById('prog'),np:document.getElementById('np'),nv:document.getElementById('np-cv'),
  nt:document.getElementById('np-ti'),ns:document.getElementById('np-si'),
  em:document.getElementById('np-em')};

function DM(cv, idx, w, h) {
  var dr, dg, cs=5, rs=5;
  if (w >= 120) { dr=11; dg=6; }
  else if (w >= 80) { dr=7; dg=3; }
  else { dr=2.5; dg=1.5; }
  var sp = 2*dr+dg;
  var tx = cs*2*dr+(cs-1)*dg, ty = rs*2*dr+(rs-1)*dg, ox = (w-tx)/2, oy = (h-ty)/2;
  var co = DCS[idx % DCS.length], pa = idx % 8, t = 0;
  function drw() {
    cx.clearRect(0,0,w,h); t += 0.05;
    for (var r = 0; r < rs; r++) {
      for (var c = 0; c < cs; c++) {
        var x = ox+dr+c*sp, y = oy+dr+r*sp, a = 0.05, ph = (r*cs+c)*0.4;
        switch (pa) {
          case 0: a = 0.2+0.8*(0.5+0.5*Math.sin(t*3+ph)); break;
          case 1: a = Math.abs(r-((t*1.5)%5))<1?0.9:0.08; break;
          case 2: a = 0.15+0.85*(0.5+0.5*Math.sin(t*2-Math.sqrt(c*c+r*r)/2+ph*0.3)); break;
          case 3: a = Math.abs(c-((t*1.2+r*0.7)%5))<0.8?0.85:0.06; break;
          case 4: var bx=0.5+0.5*Math.sin(t*1.5),by=0.5+0.5*Math.cos(t*1.8);a=Math.max(0,0.9-(Math.abs(c/4-bx)+Math.abs(r/4-by))*1.2); break;
          case 5: var fl=Math.sin(r*12.9898+c*78.233+pa*43.21)*43758.5453;fl-=Math.floor(fl);a=0.1+0.8*(0.5+0.5*Math.sin(t*3+fl*12)); break;
          case 6: a = 0.1+0.85*(0.5+0.5*Math.sin(t*2-(c+r)/8*6)); break;
          case 7: var p=0.5+0.5*Math.sin(t*2.5);a=((c+r)%2===0)?(0.2+0.8*p):(0.06+0.4*(1-p)); break;
        }
        cx.globalAlpha = Math.max(0.04,Math.min(1,a));
        cx.fillStyle = co; cx.beginPath(); cx.arc(x,y,dr,0,Math.PI*2); cx.fill();
      }
    }
    cx.globalAlpha = 1; ri = requestAnimationFrame(drw);
  }
  var cx = cv.getContext('2d');
  var ri = requestAnimationFrame(drw);
  return function(){ cancelAnimationFrame(ri); };
}

function SD() { dS.forEach(function(f){if(f)f();}); dS=[]; }

var nDS = null;
function nDSi(idx) { if(nDS)nDS(); nDS=DM($.nv, idx, 90, 90); }
function nDSo() { if(nDS)nDS(); nDS=null; }

function SB(sc, to) {
  var sb = document.getElementById('sbar'), st = document.getElementById('stb');
  var th = to*RH;
  if (th > VH) {
    sb.classList.add('sh');
    var h = Math.max(20, VH*(VH/th)), mx = Math.max(1, to-VI);
    st.style.height = h+'px';
    st.style.top = (mx>0?(sc/mx)*(VH-h-8):0)+'px';
  } else sb.classList.remove('sh');
}

function rA() {
  $.sd.textContent = 'ALBUMS';
  SD();
  var mx = Math.max(0, ALBUMS.length-VI);
  aS = Math.min(Math.max(0,aS), mx);
  var f = document.createDocumentFragment();
  for (var i = aS; i < ALBUMS.length && i < aS+VI+2; i++) {
    var a = ALBUMS[i], r = document.createElement('div');
    r.className = 'rw' + (i===aI?' sel':'');
    if (a.tracks.length === 0) r.classList.add('nad');
    var cv = document.createElement('canvas');
    cv.className = 'dc'; cv.width = 28; cv.height = 28;
    r.appendChild(cv);
    var l = document.createElement('div');
    l.className = 'lb'; l.textContent = a.name;
    r.appendChild(l);
    f.appendChild(r);
    dS[i] = DM(cv, i, 28, 28);
    (function(idx){r.addEventListener('pointerup',function(){aI=idx;if(ALBUMS[idx].tracks.length>0)sTr();});})(i);
  }
  $.lst.innerHTML = ''; $.lst.appendChild(f);
  SB(aS, ALBUMS.length);
}

function rT() {
  var al = ALBUMS[aI];
  $.sd.textContent = al.name+' ('+al.tracks.length+')';
  SD();
  var mx = Math.max(0, al.tracks.length-VI);
  tS = Math.min(Math.max(0,tS), mx);
  var f = document.createDocumentFragment();
  for (var i = tS; i < al.tracks.length && i < tS+VI+2; i++) {
    var t = al.tracks[i], r = document.createElement('div');
    var iP = pA===aI && pT===i;
    r.className = 'rw' + (i===tI?' sel':'') + (iP?' ing':'');
    var cv = document.createElement('canvas');
    cv.className = 'dc'; cv.width = 28; cv.height = 28;
    r.appendChild(cv);
    var l = document.createElement('div');
    l.className = 'lb'; l.textContent = t.name;
    r.appendChild(l);
    f.appendChild(r);
    dS[i] = DM(cv, i+aI*DCS.length, 28, 28);
    (function(idx){r.addEventListener('pointerup',function(){tI=idx;var a=ALBUMS[aI];if(a.tracks.length>0)pTk(aI,idx);});})(i);
  }
  $.lst.innerHTML = ''; $.lst.appendChild(f);
  SB(tS, al.tracks.length);
}

function sNP() {
  if (pA<0) return;
  var a = ALBUMS[pA], t = a.tracks[pT];
  $.ns.textContent = a.name;
  $.nt.textContent = t.name;
  nDSi(pT+pA*DCS.length);
  $.np.classList.add('sh');
  $.pg.classList.remove('idle');
  $.pg.classList.add('playing');
  MD = 'np';
}

function hNP() {
  $.np.classList.remove('sh');
  $.em.classList.remove('sh');
  nDSo();
  // Clear embed to stop audio
  $.em.innerHTML = '';
  MD = 'tr';
  rT();
}

function sTr() { MD = 'tr'; tS = 0; tI = 0; rT(); }

function sAl() {
  $.np.classList.remove('sh');
  $.em.classList.remove('sh');
  nDSo();
  $.em.innerHTML = '';
  $.pg.classList.remove('playing');
  $.pg.classList.add('idle');
  $.pf.style.width = '0%';
  MD = 'al'; rA();
}

function pTk(ai, ti) {
  if (ai<0||ai>=ALBUMS.length) return;
  var a = ALBUMS[ai];
  if (ti<0||ti>=a.tracks.length) return;
  pA=ai; pT=ti;
  sNP();
  // Load Google Drive embed player
  $.em.classList.add('sh');
  $.em.innerHTML = '<iframe src="https://drive.google.com/file/d/'+a.tracks[ti].id+'/preview" allow="autoplay" style="width:240px;height:282px;border:none;"></iframe>';
}

// No on-screen back button in np mode — use R1 side button / long press

window.addEventListener('scrollUp',function(){
  if(MD==='al'){if(aI<ALBUMS.length-1){aI++;if(aI>aS+VI-1)aS++;rA();}}
  else if(MD==='tr'){var a=ALBUMS[aI];if(tI<a.tracks.length-1){tI++;if(tI>tS+VI-1)tS++;rT();}}
  // scroll does nothing in np mode - use embed's controls
});
window.addEventListener('scrollDown',function(){
  if(MD==='al'){if(aI>0){aI--;aS=Math.min(aS,aI);rA();}}
  else if(MD==='tr'){if(tI>0){tI--;tS=Math.min(tS,tI);rT();}}
  // scroll does nothing in np mode - use embed's controls
});

window.addEventListener('longPressStart',function(){
  if(MD==='al'){if(ALBUMS[aI].tracks.length>0)sTr();}
  else if(MD==='tr'){var a=ALBUMS[aI];if(a.tracks.length>0)pTk(aI,tI);}
  else if(MD==='np')hNP();
});

window.addEventListener('sideClick',function(){
  if(MD==='np')hNP();
  else if(MD==='tr')sAl();
